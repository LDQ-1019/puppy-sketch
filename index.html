<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金毛幼犬素描</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f5f3ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 {
      font-size: 1.5rem;
      color: #5a4a3a;
      margin-bottom: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .frame {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(90, 74, 58, 0.15);
      max-width: 640px;
      width: 100%;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .caption {
      margin-top: 1rem;
      text-align: center;
      color: #9a8a7a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>金毛幼犬 · 素描</h1>
  <div class="frame">
    <img src="puppy.png" alt="金毛幼犬素描">
    <p class="caption">一只吐着舌头的小金毛，铅笔手绘质感</p>
  </div>
</body>
</html>
